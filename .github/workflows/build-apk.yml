name: Build NovaSinema Signed Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Generate Release Keystore (if not provided via Secrets)
        run: |
          keytool -genkeypair -v \
            -keystore novasinema-release.jks \
            -alias novasinema \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "NovaSinema@2026" \
            -keypass "NovaSinema@2026" \
            -dname "CN=NovaSinema, OU=Media, O=NovaSinema, L=Tehran, ST=Tehran, C=IR"

          cat <<EOF > keystore.properties
          storeFile=novasinema-release.jks
          storePassword=NovaSinema@2026
          keyAlias=novasinema
          keyPassword=NovaSinema@2026
          EOF

      - name: Build Signed Release APK & Debug APK
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaSinema-Release-Signed-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaSinema-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
